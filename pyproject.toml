[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marlin-twin"
version = "0.1.0"
description = "MARLIN-Twin: Maritime Adaptive Resilience Learning with Integrated Networked Twins"
readme = "README.md"
authors = [
    { name = "MARLIN-Twin Team" }
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marlin_twin*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py310"]
